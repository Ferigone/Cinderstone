[package]
name = "mc121-rust"
version = "0.1.0"
edition = "2021"
description = "Minecraft Java 1.21 protocol compatibility and differential-port workbench"
license = "GPL-2.0-only"
repository = "https://github.com/Ferigone/Cinderstone"
publish = false
default-run = "mc121-rust"

[dependencies]
anyhow = "1"
aes = { version = "0.8", features = ["zeroize"] }
base64 = "0.22"
bytes = "1"
flate2 = "1"
md5 = "0.7"
lz4_flex = "0.11"
libc = "0.2"
rand = "0.8"
openssl = { version = "0.10", features = ["vendored"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha1 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["full"] }
xxhash-rust = { version = "0.8", features = ["xxh32"] }
zeroize = "1"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

